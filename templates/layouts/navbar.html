<nav class="navbar sticky-top border-bottom bg-body-tertiary" aria-label="Manager navigation">
  <div class="container gap-2">
    <a class="navbar-brand fw-bold me-auto" href="{{ url_for('index') }}">UESL <span class="fw-normal">Manager</span></a>
    <button class="btn btn-sm btn-outline-secondary" id="themeSwitch" type="button">Light theme</button>
    {% if current_user.is_authenticated %}
    <div class="dropdown">
      <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">Data</button>
      <ul class="dropdown-menu dropdown-menu-end">
        {% for endpoint, label in [('u2table','Accounts'), ('sections','Sections'), ('persona','Personas')] %}
        <li><a class="dropdown-item" href="{{ url_for(endpoint) }}">{{ label }}</a></li>
        {% endfor %}
      </ul>
    </div>
    <div class="dropdown">
      <button class="btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">{{ current_user.name }}</button>
      <div class="dropdown-menu dropdown-menu-end">
        <span class="dropdown-item-text small">{{ current_user.uid }} · {{ current_user.role }}</span>
        <a class="dropdown-item" href="{{ url_for('logout') }}">Sign out</a>
      </div>
    </div>
    {% else %}
    <a class="btn btn-primary" href="{{ url_for('login') }}">Sign in</a>
    {% endif %}
  </div>
</nav>
<script>
  const themeSwitch = document.getElementById("themeSwitch");
  function setManagerTheme(theme) {
    document.documentElement.dataset.bsTheme = theme;
    themeSwitch.textContent = theme === "dark" ? "Light theme" : "Dark theme";
  }
  setManagerTheme(localStorage.getItem("uesl-manager-theme") === "light" ? "light" : "dark");
  themeSwitch.addEventListener("click", () => {
    const theme = document.documentElement.dataset.bsTheme === "dark" ? "light" : "dark";
    setManagerTheme(theme);
    localStorage.setItem("uesl-manager-theme", theme);
  });
</script>
