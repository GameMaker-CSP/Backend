{% extends "layouts/base.html" %}
{% set project = "Sign in" %}
{% block body %}
<div class="container mt-5">
 <div class="card login-panel mx-auto"><div class="card-body p-4">
 <h1 class="h3">Manager sign in</h1>
 {% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}
 <form method="post" action="{{ url_for('login') }}">
 <input type="hidden" name="next" value="{{ next }}">
 <label class="form-label" for="username">User ID</label><input class="form-control mb-3" id="username" name="username" autocomplete="username" required>
 <label class="form-label" for="password">Password</label><input class="form-control mb-3" type="password" id="password" name="password" autocomplete="current-password" required>
 <button class="btn btn-primary w-100">Sign in</button>
 </form><div class="mt-3" id="g_btn"></div></div></div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    function handleGoogleCredential(response) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/google-login';
        const cred = document.createElement('input');
        cred.type = 'hidden'; cred.name = 'credential'; cred.value = response.credential;
        const next = document.createElement('input');
        next.type = 'hidden'; next.name = 'next'; next.value = {{ next|tojson }};
        form.appendChild(cred); form.appendChild(next);
        document.body.appendChild(form);
        form.submit();
    }

    window.onGoogleLibraryLoad = function () {
        google.accounts.id.initialize({
            client_id: '714327350398-q7jtd45cknoa0ijsgsg0d0iedk7epqdo.apps.googleusercontent.com',
            callback: handleGoogleCredential,
            ux_mode: 'popup'
        });
        google.accounts.id.renderButton(document.getElementById('g_btn'), {
            type: 'standard', size: 'large',
            width: document.getElementById('g_btn').offsetWidth || 360
        });
    };
</script>
{% endblock %}
