# UESL stack (root compose, used for deployment).
# deploy/compose.yml is the newer upstream stack. Run one at a time: both
# publish host port 8540, so the second fails with "port is already allocated".
services:
  web:
    image: flask_open
    build: .
    env_file:
      - .env
    ports:
      - "8540:8424"
    volumes:
      # Persists the SQLite database and uploads between container restarts
      - ./instance:/app/instance
    restart: unless-stopped
    depends_on:
      - socketio

  socketio:
    image: socket_open
    build: ./socket
    ports:
      - "8541:8501"
    restart: unless-stopped