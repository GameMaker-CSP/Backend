name: gamemaker-csp
services:
  backend:
    build:
      context: ..
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/library}
    image: gamemaker-csp-backend:local
    env_file: .env
    environment:
      DEPLOYMENT_MODE: "true"
      JWT_TOKEN_NAME: gamemaker_auth
      SESSION_COOKIE_NAME: gamemaker_session
    ports:
      - "127.0.0.1:8430:8424"
    volumes:
      - backend-data:/app/instance
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  frontend:
    build:
      context: ../../Frontend
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/library}
    image: gamemaker-csp-frontend:local
    ports:
      - "127.0.0.1:8431:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  backend-data:
