# Include once inside the HTTPS server for ueslgame-api.opencodingsociety.com.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8540;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Flask handles credentialed CORS, including OPTIONS and error responses.
    # A location-level header prevents inheritance of old wildcard CORS headers.
    add_header Vary Origin always;
}
